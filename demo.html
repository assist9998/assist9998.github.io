let LANG = 'en', CUR = 0;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const L = pair => pair[LANG === 'ru' ? 0 : 1];

const rub = n => n.toLocaleString(LANG === 'ru' ? 'ru-RU' : 'en-US') + '\u00A0' + (LANG === 'ru' ? 'у.\u00A0е.' : 'c.u.');
const unit = p => p.pr.door + p.pr.color + p.pr.steel + p.pr.install;
function priceRows(p, t) {
  const rows = [['door', p.pr.door], ['color', p.pr.color], ['steel', p.pr.steel], ['inst', p.pr.install]]
    .filter(r => r[1] > 0).map(r => `<div class="pr"><span>${esc(t.pr[r[0] === 'inst' ? 'inst' : r[0]])}</span><span>${rub(r[1])}</span></div>`).join('');
  return rows + `<div class="pr"><span>${esc(t.pr.unit)}</span><span>${rub(unit(p))}</span></div><div class="pr sum"><span>${esc(t.pr.sum)} (${p.qty} ${esc(t.qty)})</span><span>${rub(unit(p) * p.qty)}</span></div>`;
}

function render() {
  const t = I18N[LANG], ex = EX[CUR], q = t.q;
  document.getElementById('tabs').innerHTML = t.tabs.map((n, i) => `<button class="tab${i === CUR ? ' active' : ''}" data-i="${i}">${esc(n)}</button>`).join('');
  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { CUR = +b.dataset.i; render(); }));
  document.getElementById('mail').textContent = ex.text;
  document.getElementById('mcFrom').textContent = q.from;
  document.getElementById('mcSubj').textContent = q.subj;

  let total = ex.delivery || 0;
  ex.pos.forEach(p => { total += unit(p) * p.qty; });
  if (ex.line) total += (ex.line.price + ex.line.install) * ex.line.qty;
  const count = ex.pos.length + (ex.line ? 1 : 0);

  const leavesTxt = n => LANG === 'ru' ? (n === 1 ? '1 створка' : n + ' створки') : (n === 1 ? '1 leaf' : n + ' leaves');
  const chipOf = (p, k, label, value) => `<span class="chip${p.defs.includes(k) ? ' def' : ''}">${esc(label)}: ${esc(value)}${p.defs.includes(k) ? ' · ' + esc(t.def) : ''}</span>`;
  const cards = ex.pos.map(p => {
    const chips = [
      p.defs.includes('side') ? chipOf(p, 'side', t.f.side, L(p.side)) : '',
      chipOf(p, 'thr', t.f.thr, p.thr + ' ' + (LANG === 'ru' ? 'мм' : 'mm')),
      chipOf(p, 'closer', t.f.closer, L(p.closer)),
      chipOf(p, 'lock', t.f.lock, L(p.lock)),
      chipOf(p, 'handle', t.f.handle, L(p.handle)),
    ].join('');
    const sub = [`${p.order} → ${p.frame}`, leavesTxt(p.leaves), p.defs.includes('side') ? '' : L(p.side), p.color].filter(Boolean).join(' · ');
    return `<article class="qcard">
      <div class="qc-top"><div><div class="qc-title">${esc(L(p.type))}</div><div class="qc-sub">${esc(sub)}</div></div><div class="qc-qty">× ${p.qty}</div></div>
      <div class="chips">${chips}</div>
      <div class="qc-price"><span>${rub(unit(p))} × ${p.qty}</span><b>${rub(unit(p) * p.qty)}</b></div>
      <details><summary>${esc(q.calc)}</summary><div class="prices">${priceRows(p, t)}</div></details>
    </article>`;
  }).join('');
  const line = ex.line ? `<article class="qcard">
      <div class="qc-top"><div><div class="qc-title">${esc(t.pr.closers)}</div></div><div class="qc-qty">× ${ex.line.qty}</div></div>
      <div class="qc-price"><span>${rub(ex.line.price + ex.line.install)} × ${ex.line.qty}</span><b>${rub((ex.line.price + ex.line.install) * ex.line.qty)}</b></div>
    </article>` : '';
  const deliv = ex.delivery ? `<div class="totalcard"><div class="pr"><span>${esc(t.pr.deliv)}</span><span>${rub(ex.delivery)}</span></div></div>` : '';
  const flags = ex.flags.length ? `<div class="checkcard"><b>${esc(q.check)}</b><ul>${ex.flags.map(f => `<li>${esc(L(f))}</li>`).join('')}</ul></div>` : '';
  document.getElementById('out').innerHTML = `<div class="sumbar"><span class="sb-l">${count} ${esc(q.items)}</span><span class="sb-t">${rub(total)}</span></div>` + cards + line + deliv + flags;
}

  document.getElementById('tTag').textContent = t.tag;

  document.getElementById('tLead').textContent = t.lead;
  document.getElementById('tNote').textContent = t.note;
  document.getElementById('tIn').textContent = t.tIn;
  document.getElementById('tOut').textContent = t.tOut;
  document.getElementById('tMgr').textContent = t.mgr;
  document.getElementById('hH').textContent = t.how.h;

  document.getElementById('hHonest').textContent = t.how.honest;
  document.getElementById('swOrders').textContent = t.sw[0];
  document.getElementById('swSchool').textContent = t.sw[1];
  document.getElementById('swKids').textContent = t.sw[2];
  document.getElementById('swBot').textContent = t.sw[3];

  document.getElementById('bNote').textContent = t.bot.note;

  try { localStorage.setItem('lang', lang); } catch (e) {}
  render();
}

document.querySelectorAll('.lang-btn').forEach(b => b.addEventListener('click', () => applyLang(b.dataset.lang)));
let start = 'en';
try { start = localStorage.getItem('lang') || ((navigator.language || '').toLowerCase().startsWith('ru') ? 'ru' : 'en'); } catch (e) {}
applyLang(start);


function rich(x) { return esc(x).replace(/\[\[(.+?)\|(\w+)\]\]/g, '<a class="inl" href="#$2">$1</a>'); }
function updateSchoolFrame() {
  Object.keys(FRAMES).forEach(k => {
    if (SCH.shown !== k) return;
    const key = k + LANG;
    if (SCH['last_' + k] === key) return;
    SCH['last_' + k] = key;
    document.getElementById(FRAMES[k][0]).src = 'https://assist9998.github.io/school-demo/' + FRAMES[k][1] + '?embed=1&v=20261127i&lang=' + LANG;
  });
}

// Телефон рисуется в натуральном размере 380×760 и ужимается под экран: по ширине и по высоте окна, на телефонах ещё чуть меньше.
function fitPhones() {
  document.querySelectorAll('.phone-scale').forEach(box => {
    const col = box.parentElement, phone = box.firstElementChild;
    const w = col.clientWidth;
    if (!w) return;
    let k = Math.min(1, w / 380, (window.innerHeight - 110) / 760);
    if (window.innerWidth <= 600) k *= 0.88;
    k = Math.max(0.45, k);
    phone.style.transform = 'scale(' + k + ')';
    box.style.width = (380 * k) + 'px';
    box.style.height = (760 * k) + 'px';
  });
}
window.addEventListener('resize', fitPhones);
function viewFromHash() { return location.hash === '#school' ? 'school' : location.hash === '#kids' ? 'kids' : location.hash === '#bot' ? 'bot' : 'orders'; }
function setView(v, push) {
  ['orders', 'school', 'kids', 'bot'].forEach(k => { document.getElementById('view-' + k).style.display = k === v ? '' : 'none'; });
  document.querySelectorAll('#demoSwitch button').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  SCH.shown = v;
  updateSchoolFrame();
  fitPhones();
  if (push) { try { history.replaceState(null, '', v === 'orders' ? location.pathname + location.search : '#' + v); } catch (e) {} }
}
document.querySelectorAll('#demoSwitch button').forEach(b => b.addEventListener('click', () => setView(b.dataset.view, true)));
setView(viewFromHash(), false);
window.addEventListener('hashchange', () => { setView(viewFromHash(), false); window.scrollTo({ top: 0, behavior: 'smooth' }); });
(function () {
  var nav = document.getElementById('nav'), bg = document.getElementById('burger');
  window.addEventListener('scroll', function () { nav.classList.toggle('scrolled', window.scrollY > 40); });
  bg.addEventListener('click', function (e) { e.stopPropagation(); var o = nav.classList.toggle('open'); bg.setAttribute('aria-expanded', o ? 'true' : 'false'); });
  document.addEventListener('click', function (e) { if (!nav.contains(e.target)) nav.classList.remove('open'); });
  nav.querySelectorAll('.nav-menu a').forEach(function (a) { a.addEventListener('click', function () { nav.classList.remove('open'); }); });
})();
</script>
